[package]
name = "smallmobile-lab3"
version = "0.1.0"
edition = "2024"
description = "Laboratoire 3 : un réseau par nombre de joueurs, sur la recherche de lab2 (journal.md)."
publish = false

[[bin]]
name = "lab3"
path = "src/bin/lab.rs"

[features]
# le réseau sur GPU pour la génération des parties (`lab3 selfplay --device gpu`, src/gpu.rs) :
# PyTorch appelé par pyo3
gpu = ["dep:pyo3"]
# le réseau sur GPU par Vulkan, sans Python (`lab3 selfplay --device vulkan`, src/vulkan.rs) ;
# shaders compilés par glslc (build.rs)
vulkan = ["dep:ash"]

[dependencies]
smallmobile-kernel = { path = "../kernel" }
smallmobile-brain3 = { path = "brain" }
# l'Expert de lab2, adversaire témoin de l'arène (`lab2:net=…`)
smallmobile-brain2 = { path = "../lab2/brain" }
pyo3 = { version = "0.30", features = ["auto-initialize"], optional = true }
ash = { version = "0.38", optional = true }
