[workspace]
# kernel : le jeu (règles, IA, cartes), compilé en WebAssembly pour le téléphone et le serveur.
# labN : un laboratoire de l'IA Expert (une approche, son journal, ses données) ; labN/brain : son
# Expert, joué par le serveur (programme labN-expert) et par les labos. Voir labtools/README.md.
members = ["kernel", "lab1", "lab1/brain"]
resolver = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Les tests jouent des parties entières : compilés avec optimisations.
[profile.test]
opt-level = 3

# Le module WebAssembly livré au téléphone : plus compact, même code.
[profile.web]
inherits = "release"
opt-level = "s"
strip = true
